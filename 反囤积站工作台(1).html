<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反囤积站 · 收藏变行动</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
  
  :root {
    --bg: #FAFAF8;
    --card: #FFFFFF;
    --accent: #FF6B35;
    --accent-light: #FFF0EB;
    --text: #1A1A1A;
    --text-secondary: #6B7280;
    --border: #E5E7EB;
    --green: #10B981;
    --green-light: #D1FAE5;
    --blue: #3B82F6;
    --purple: #8B5CF6;
    --pink: #EC4899;
    --yellow: #F59E0B;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 280px;
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    position: fixed;
    height: 100vh;
    overflow-y: auto;
    z-index: 10;
  }

  .sidebar-logo {
    font-size: 20px;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .sidebar-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 32px;
  }

  .stats-box {
    background: linear-gradient(135deg, var(--accent), #FF8F5E);
    border-radius: 16px;
    padding: 20px;
    color: #fff;
    margin-bottom: 28px;
  }

  .stats-box .stats-num {
    font-size: 42px;
    font-weight: 900;
    line-height: 1;
  }

  .stats-box .stats-label {
    font-size: 13px;
    opacity: 0.9;
    margin-top: 4px;
  }

  .progress-section {
    margin-bottom: 28px;
  }

  .progress-section .label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .progress-bar-outer {
    width: 100%;
    height: 10px;
    background: #F3F4F6;
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--green), #34D399);
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  .progress-text {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  .sidebar-nav {
    flex: 1;
  }

  .nav-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    margin-top: 8px;
  }

  .tag-filter {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .tag-filter-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: none;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    transition: all 0.2s;
    text-align: left;
  }

  .tag-filter-btn:hover {
    background: #F3F4F6;
  }

  .tag-filter-btn.active {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 500;
  }

  .tag-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .tag-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-secondary);
    background: #F3F4F6;
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* ===== Main ===== */
  .main {
    margin-left: 280px;
    flex: 1;
    padding: 40px 48px;
    max-width: 900px;
  }

  /* Slogan */
  .slogan {
    font-size: 32px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--text) 0%, #374151 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .slogan-sub {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 32px;
  }

  /* Daily Reminder */
  .daily-reminder {
    background: linear-gradient(135deg, #FEF3C7, #FDE68A);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  .daily-reminder::before {
    content: '';
    position: absolute;
    top: -20px;
    right: -20px;
    width: 80px;
    height: 80px;
    background: rgba(245, 158, 11, 0.15);
    border-radius: 50%;
  }

  .reminder-icon {
    font-size: 32px;
    flex-shrink: 0;
  }

  .reminder-content {
    flex: 1;
  }

  .reminder-title {
    font-size: 14px;
    font-weight: 700;
    color: #92400E;
    margin-bottom: 4px;
  }

  .reminder-text {
    font-size: 13px;
    color: #78350F;
  }

  .reminder-btn {
    padding: 8px 16px;
    background: #F59E0B;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .reminder-btn:hover {
    background: #D97706;
  }

  /* Add Button */
  .add-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
  }

  .add-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
    transition: all 0.2s;
  }

  .add-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
  }

  .search-box {
    flex: 1;
    padding: 12px 18px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box:focus {
    border-color: var(--accent);
  }

  /* Cards */
  .cards-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }

  .card:hover {
    box-shadow: var(--shadow-lg);
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
  }

  .card-platform {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
    flex-shrink: 0;
    margin-left: 12px;
  }

  .platform-xiaohongshu { background: #FFEEF0; color: #FF2442; }
  .platform-bilibili { background: #E8F4FD; color: #00A1D6; }
  .platform-podcast { background: #F0E6FF; color: #8B5CF6; }
  .platform-article { background: #E8FDF0; color: #10B981; }
  .platform-other { background: #F3F4F6; color: #6B7280; }

  .card-thought {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 14px;
    padding: 10px 14px;
    background: #F9FAFB;
    border-radius: 10px;
    border-left: 3px solid var(--accent);
    line-height: 1.6;
  }

  .card-todos {
    list-style: none;
    margin-bottom: 14px;
  }

  .card-todos li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    font-size: 14px;
    border-bottom: 1px solid #F3F4F6;
  }

  .card-todos li:last-child { border-bottom: none; }

  .card-todos li.done {
    text-decoration: line-through;
    color: var(--text-secondary);
  }

    width: 20px;
    height: 20px;
    border: 2px solid #D1D5DB;
    border-radius: 6px;
    cursor: pointer;
    disp
